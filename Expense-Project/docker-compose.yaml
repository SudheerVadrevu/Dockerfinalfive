name: expense
networks:
  default:
    name: swiss
volumes:
  paris:
    external: true

services:

  mysql:
    #image: mysql:0.0
    image: sudheer1995/genzmysql:8.9 
    container_name: mysql
    volumes:
      - source: paris
        target: /var/lib/mysql
        type: volume
  
  backend:
    #image: backend:0.0
    image: sudheer1995/genzbackend:8.9 
    container_name: backend
    command: sh -c "sleep 20 && node /opt/server/index.js"
    depends_on:
      - mysql
    ports:
      - 8080:8080
  
  frontend:
    #image: frontend:0.0
    image: sudheer1995/genzfrontend:8.9 
    container_name: frontend
    depends_on:
      - backend
    ports:
      - 80:80